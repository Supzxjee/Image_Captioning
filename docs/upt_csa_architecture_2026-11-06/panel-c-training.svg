<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1488 952 912 824" role="img" aria-labelledby="panel-c-training-title panel-c-training-desc" id="panel-c-training-root"><title id="panel-c-training-title">Region-linked prompts for image captioning</title><desc id="panel-c-training-desc">Frozen visual and semantic encoders feed cascade alignment, region-linked prompt adapters, a parallel decoder and caption reranking, with a separate training objective.</desc><defs>
      <style>#panel-c-training-root { color: #26333e; font-family: Arial,"Liberation Sans",sans-serif; }
      #panel-c-training-root .diagram-container { width:100%;overflow-x:auto }
      #panel-c-training-root figcaption { font-size:16px;line-height:1.6;max-width:1000px;margin:20px auto;padding:0 24px 24px }
      @media print {
#panel-c-training-root .diagram-container { overflow:visible }
      #panel-c-training-root figcaption { display:none }
}</style><marker id="panel-c-training-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#53616c"/></marker></defs><rect x="1488" y="952" width="912" height="824" fill="#fff"/><rect x="1512" y="976" width="864" height="776" rx="0" fill="#fff" stroke="#c7d0d6" stroke-width="1"/><text x="1536" y="1018" font-family="Arial, Liberation Sans, sans-serif" font-size="32" font-weight="600" text-anchor="start" fill="#26333e">(c) Training objective</text><rect x="1544" y="1696" width="800" height="48" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.2"/><path data-edge="teacher-forcing" d="M 1864,1140 L 1912,1140" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><path data-edge="model-sample" d="M 1736,1384 L 1754.0,1384.0 Q 1760,1384 1760.0,1378.0 L 1760.0,1378.0 Q 1760,1372 1766.0,1372.0 L 1784,1372" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><path data-edge="model-greedy" d="M 1736,1440 L 1752.0,1440.0 Q 1760,1440 1760.0,1448.0 L 1760.0,1484.0 Q 1760,1492 1768.0,1492.0 L 1784,1492" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><path data-edge="sample-advantage" d="M 2008,1372 L 2032.0,1372.0 Q 2040,1372 2040.0,1380.0 L 2040.0,1404.0 Q 2040,1412 2048.0,1412.0 L 2072,1412" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><path data-edge="greedy-advantage" d="M 2008,1492 L 2048.0,1492.0 Q 2056,1492 2056.0,1484.0 L 2056.0,1476.0 Q 2056,1468 2064.0,1468.0 L 2072,1468" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><path data-edge="refs-advantage" d="M 2208,1544 L 2208,1504" fill="none" stroke="#53616c" stroke-width="1.7" marker-end="url(#panel-c-training-arrow)"/><text x="1544" y="1060" font-family="Arial, Liberation Sans, sans-serif" font-size="29" font-weight="600" text-anchor="start" fill="#26333e">Stage 1 · Cross-entropy</text><g id="train-prefix"><rect data-role="node" data-node-id="train-prefix" x="1544" y="1096" width="320" height="88" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.4"/><text x="1704.0" y="1132.64" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="train-prefix">Shifted TRAIN caption</text><text x="1704.0" y="1164.64" font-family="Arial, Liberation Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#26333e" data-owner="train-prefix">Teacher forcing</text></g><g id="xe-model"><rect data-role="node" data-node-id="xe-model" x="1912" y="1096" width="432" height="88" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.4"/><text x="2128.0" y="1133.1" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="xe-model">Same caption model</text><text x="2128.0" y="1166.1" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#26333e" data-owner="xe-model">pθ(y*ₜ | I, y*&lt;ₜ)</text><rect x="1920" y="1084" width="22" height="22" rx="2" fill="#fff" stroke="#82909b" stroke-width="1"/><text x="1931" y="1101" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#26333e">L</text></g><text x="1944" y="1232" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#26333e">LCE = −mean log pθ(y*ₜ | I, y*&lt;ₜ)</text><text x="1544" y="1300" font-family="Arial, Liberation Sans, sans-serif" font-size="29" font-weight="600" text-anchor="start" fill="#26333e">Stage 2 · Self-critical training</text><g id="scst-model"><rect data-role="node" data-node-id="scst-model" x="1544" y="1360" width="192" height="104" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.4"/><text x="1640.0" y="1405.14" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="scst-model">Same model</text><text x="1640.0" y="1436.14" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#26333e" data-owner="scst-model">Same image I</text></g><g id="sampling"><rect data-role="node" data-node-id="sampling" x="1784" y="1336" width="224" height="72" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.4"/><text x="1896.0" y="1380.64" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="sampling">Sampling → yₛ</text></g><g id="greedy"><rect data-role="node" data-node-id="greedy" x="1784" y="1456" width="224" height="72" rx="6" fill="#f1edf8" stroke="#82909b" stroke-width="1.4"/><text x="1896.0" y="1500.64" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="greedy">Greedy → y<tspan baseline-shift="sub" font-size="0.75em">g</tspan></text></g><g id="advantage"><rect data-role="node" data-node-id="advantage" x="2072" y="1376" width="272" height="128" rx="6" fill="#ffffff" stroke="#82909b" stroke-width="1.4"/><text x="2208.0" y="1432.14" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="advantage">CIDEr advantage</text><text x="2208.0" y="1465.14" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#26333e" data-owner="advantage">A = r(yₛ) − r(y<tspan baseline-shift="sub" font-size="0.75em">g</tspan>)</text></g><g id="train-refs"><rect data-role="node" data-node-id="train-refs" x="2072" y="1544" width="272" height="56" rx="6" fill="#edf5e9" stroke="#82909b" stroke-width="1.4"/><text x="2208.0" y="1580.0" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#26333e" data-owner="train-refs">Ytrain references</text></g><text x="1544" y="1560" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#26333e">r(y) = CIDEr(y, Ytrain)</text><text x="1944" y="1640" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#26333e">LSCST = −mean_batch [stopgrad(A)</text><text x="1944" y="1676" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#26333e">× Σₜ log pθ(yₛ,ₜ | I, yₛ,&lt;ₜ)]</text><text x="1944" y="1730" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#26333e">L = LCE + 0.05 LSCST</text></svg>
