<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2480" viewBox="0 0 3000 2480"><rect width="100%" height="100%" fill="white"/><text x="60" y="86" font-family="Arial" font-size="58" fill="#173D5B" font-weight="bold">PIPELINE CHI TIẾT: CSA + PROMPT ĐỐI TƯỢNG–QUAN HỆ</text><text x="60" y="141" font-family="Arial" font-size="36" fill="#536574">Cấu hình đã chạy: XE từ đầu → SCST + CE → beam 5 → reranking cố định</text><rect x="60" y="190" width="900" height="155" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="84" y="244" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">1. Ảnh đầu vào I</text><text x="84" y="288" font-family="Arial" font-size="30" fill="#172B3A">Cùng một ảnh được cấp cho nhánh thị giác và UPT.</text><text x="84" y="325" font-family="Arial" font-size="30" fill="#172B3A">TEST: chỉ dùng ảnh; không dùng caption tham chiếu.</text><rect x="1050" y="190" width="900" height="155" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="1074" y="244" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">2. UPT: người – hành động – vật</text><text x="1074" y="288" font-family="Arial" font-size="30" fill="#172B3A">Box S/O, nhãn đối tượng, hành động và điểm cặp.</text><text x="1074" y="325" font-family="Arial" font-size="30" fill="#172B3A">UPT là nguồn dự đoán; không phải nhãn đúng tuyệt đối.</text><rect x="2040" y="190" width="900" height="155" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="2064" y="244" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">3. Bank ngữ nghĩa cố định</text><text x="2064" y="288" font-family="Arial" font-size="30" fill="#172B3A">Danh từ / động từ từ caption TRAIN → lemma</text><text x="2064" y="325" font-family="Arial" font-size="30" fill="#172B3A">→ CLIP text encoder → bank embedding 512 chiều.</text><polyline points="960,265 1050,265" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="1050.00,265.00 1034.69,272.39 1034.69,257.61" fill="#173D5B"/><rect x="60" y="425" width="900" height="155" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="84" y="479" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">CLIP visual + box YOLO → ROI pooling</text><text x="84" y="523" font-family="Arial" font-size="30" fill="#172B3A">Bỏ CLS; lưới patch 14 × 14 × 768.</text><text x="84" y="560" font-family="Arial" font-size="30" fill="#172B3A">Pool theo box → R: N × 768; Linear → V: N × 512.</text><polyline points="510,345 510,425" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="510.00,425.00 502.61,409.69 517.39,409.69" fill="#173D5B"/><rect x="1050" y="425" width="900" height="155" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="1074" y="479" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Prompt riêng ảnh + liên kết UPT–YOLO</text><text x="1074" y="523" font-family="Arial" font-size="30" fill="#172B3A">Lọc cặp → cụm đối tượng / quan hệ → CLIP text.</text><text x="1074" y="560" font-family="Arial" font-size="30" fill="#172B3A">Ghép box cùng nhãn, IoU ≥ 0,5; lưu ROI / cặp (S,O).</text><polyline points="1500,345 1500,425" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="1500.00,425.00 1492.61,409.69 1507.39,409.69" fill="#173D5B"/><polyline points="2490,345 2490,615 995,615 995,650 930,650 930,675" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="930.00,675.00 922.61,659.69 937.39,659.69" fill="#173D5B"/><text x="2070" y="495" font-family="Arial" font-size="30" fill="#536574">Bank vẫn là một nhánh riêng,</text><text x="2070" y="540" font-family="Arial" font-size="30" fill="#536574">không thay cho prompt của từng ảnh.</text><rect x="60" y="675" width="900" height="680" rx="18" fill="#EAF3FC" stroke="#173D5B" stroke-width="3"/><text x="84" y="735" font-family="Arial" font-size="40" fill="#173D5B" font-weight="bold">4. CĂN CHỈNH CSA</text><text x="84" y="788" font-family="Arial" font-size="30" fill="#172B3A">Semantic aggregation: mỗi bank → 150 prototype.</text><text x="84" y="825" font-family="Arial" font-size="30" fill="#172B3A">Bank được giữ cố định; aggregation được học.</text><rect x="90" y="870" width="840" height="130" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="114" y="924" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Object fusion 1</text><text x="114" y="968" font-family="Arial" font-size="30" fill="#172B3A">V + prototype danh từ → V1, danh từ đã chọn</text><rect x="90" y="1045" width="840" height="130" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="114" y="1099" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Object fusion 2</text><text x="114" y="1143" font-family="Arial" font-size="30" fill="#172B3A">V1 + danh từ đã chọn → memory đối tượng Vo</text><rect x="90" y="1220" width="840" height="110" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="114" y="1274" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Relation fusion</text><text x="114" y="1318" font-family="Arial" font-size="30" fill="#172B3A">Vo + prototype động từ → memory quan hệ Vr</text><polyline points="510,580 510,675" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="510.00,675.00 502.61,659.69 517.39,659.69" fill="#173D5B"/><polyline points="510,1000 510,1045" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="510.00,1045.00 502.61,1029.69 517.39,1029.69" fill="#173D5B"/><polyline points="510,1175 510,1220" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="510.00,1220.00 502.61,1204.69 517.39,1204.69" fill="#173D5B"/><rect x="1050" y="675" width="900" height="680" rx="18" fill="#ECF8F1" stroke="#173D5B" stroke-width="3"/><text x="1074" y="735" font-family="Arial" font-size="40" fill="#173D5B" font-weight="bold">5. HAI ADAPTER PROMPT–ROI</text><rect x="1080" y="770" width="840" height="210" rx="18" fill="#F8FCF9" stroke="#173D5B" stroke-width="3"/><text x="1104" y="824" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Adapter đối tượng</text><text x="1104" y="865" font-family="Arial" font-size="27" fill="#172B3A">Slot = MLP [text đối tượng; Vo[i]; box i]</text><text x="1104" y="899" font-family="Arial" font-size="27" fill="#172B3A">Q = Vo; K = V = các slot đối tượng</text><text x="1104" y="933" font-family="Arial" font-size="27" fill="#172B3A">Mask: chỉ ROI i được đọc slot gắn với nó.</text><text x="1104" y="967" font-family="Arial" font-size="27" fill="#172B3A">Vo′ = Vo + Wout · Attention(Q,K,V)</text><rect x="1080" y="1030" width="840" height="255" rx="18" fill="#F8FCF9" stroke="#173D5B" stroke-width="3"/><text x="1104" y="1084" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Adapter quan hệ</text><text x="1104" y="1127" font-family="Arial" font-size="29" fill="#172B3A">Slot = MLP [text quan hệ; Vo[s]; Vo[o]; box S/O]</text><text x="1104" y="1163" font-family="Arial" font-size="29" fill="#172B3A">Q = Vr; K = V = các slot quan hệ</text><text x="1104" y="1199" font-family="Arial" font-size="29" fill="#172B3A">Mask: chỉ hai ROI đầu mút được đọc slot cặp.</text><text x="1104" y="1235" font-family="Arial" font-size="29" fill="#172B3A">Vr′ = Vr + Wout · Attention(Q,K,V)</text><text x="1104" y="1271" font-family="Arial" font-size="29" fill="#172B3A">S/O có thứ tự; mỗi slot giữ hình học của cặp.</text><polyline points="1500,580 1500,675" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="1500.00,675.00 1492.61,659.69 1507.39,659.69" fill="#173D5B"/><polyline points="960,1000 1020,1000 1020,895 1080,895" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="1080.00,895.00 1064.69,902.39 1064.69,887.61" fill="#173D5B"/><polyline points="1020,1000 1020,1160 1080,1160" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="1080.00,1160.00 1064.69,1167.39 1064.69,1152.61" fill="#173D5B"/><text x="1074" y="1331" font-family="Arial" font-size="28" fill="#536574">Không có slot hợp lệ → residual đúng bằng 0.</text><rect x="2040" y="675" width="900" height="425" rx="18" fill="#F2EFFA" stroke="#173D5B" stroke-width="3"/><text x="2064" y="731" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">6. TRANSFORMER DECODER ×3 LAYER</text><text x="2064" y="790" font-family="Arial" font-size="30" fill="#172B3A">Token trước → embedding + positional encoding</text><text x="2064" y="827" font-family="Arial" font-size="30" fill="#172B3A">→ masked self-attention (chỉ nhìn từ trước)</text><text x="2064" y="864" font-family="Arial" font-size="30" fill="#172B3A">→ cross-attention đối tượng: Q=h; K=V=Vo′</text><text x="2064" y="901" font-family="Arial" font-size="30" fill="#172B3A">→ cross-attention quan hệ: Q=h; K=V=Vr′</text><text x="2064" y="938" font-family="Arial" font-size="30" fill="#172B3A">→ hai gate dựa trên context và embedding từ</text><text x="2064" y="975" font-family="Arial" font-size="30" fill="#172B3A">→ go * co + gr * cr → FFN</text><text x="2064" y="1012" font-family="Arial" font-size="30" fill="#172B3A">→ Linear vocabulary → phân phối từ tiếp theo</text><polyline points="1950,1000 2040,1000" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="2040.00,1000.00 2024.69,1007.39 2024.69,992.61" fill="#173D5B"/><rect x="2040" y="1160" width="900" height="135" rx="18" fill="#EFF5FA" stroke="#173D5B" stroke-width="3"/><text x="2064" y="1214" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Beam search = 5</text><text x="2064" y="1253" font-family="Arial" font-size="25" fill="#172B3A">Tối đa 20 token; giữ raw log-prob của 5 ứng viên.</text><text x="2064" y="1285" font-family="Arial" font-size="25" fill="#172B3A">Tự hồi quy từ BOS đến EOS.</text><polyline points="2490,1100 2490,1160" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="2490.00,1160.00 2482.61,1144.69 2497.39,1144.69" fill="#173D5B"/><rect x="2040" y="1350" width="900" height="235" rx="18" fill="#FFF5E8" stroke="#173D5B" stroke-width="3"/><text x="2064" y="1404" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">7. Reranking cố định</text><text x="2064" y="1443" font-family="Arial" font-size="25" fill="#172B3A">Mỗi ứng viên có 3 điểm:</text><text x="2064" y="1475" font-family="Arial" font-size="25" fill="#172B3A">D: raw decoder log-prob, min–max trong 5 câu</text><text x="2064" y="1507" font-family="Arial" font-size="25" fill="#172B3A">C: CLIPScore ảnh–caption, min–max trong 5 câu</text><text x="2064" y="1539" font-family="Arial" font-size="25" fill="#172B3A">O: nhất quán đối tượng caption với YOLO, chuẩn hóa</text><text x="2064" y="1571" font-family="Arial" font-size="25" fill="#172B3A">S = 0,3 D + 0,4 C + 0,3 O</text><polyline points="2490,1295 2490,1350" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="2490.00,1350.00 2482.61,1334.69 2497.39,1334.69" fill="#173D5B"/><rect x="2040" y="1655" width="900" height="110" rx="18" fill="#E2F2EB" stroke="#173D5B" stroke-width="3"/><text x="2064" y="1709" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">CAPTION CUỐI CÙNG</text><text x="2064" y="1751" font-family="Arial" font-size="28" fill="#172B3A">argmax S; hòa điểm → ưu tiên thứ hạng beam trước.</text><polyline points="2490,1585 2490,1655" fill="none" stroke="#173D5B" stroke-width="4"/><polygon points="2490.00,1655.00 2482.61,1639.69 2497.39,1639.69" fill="#173D5B"/><rect x="60" y="1430" width="900" height="335" rx="18" fill="#F7FAFD" stroke="#173D5B" stroke-width="3"/><text x="84" y="1484" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Bên trong mỗi Fusion của CSA</text><text x="84" y="1528" font-family="Arial" font-size="30" fill="#172B3A">1) Cosine prototype–ROI / nhiệt độ 0,1</text><text x="84" y="1565" font-family="Arial" font-size="30" fill="#172B3A">   → softmax theo ROI → độ liên quan prototype</text><text x="84" y="1602" font-family="Arial" font-size="30" fill="#172B3A">2) Self-attention thị giác + residual/norm + FFN</text><text x="84" y="1639" font-family="Arial" font-size="30" fill="#172B3A">3) Cross-attention: Q=thị giác; K=V=prototype chọn</text><text x="84" y="1676" font-family="Arial" font-size="30" fill="#172B3A">   + residual/norm + FFN</text><text x="84" y="1713" font-family="Arial" font-size="30" fill="#172B3A">4) Gate sigmoid trộn nhánh thị giác và ngữ nghĩa.</text><text x="84" y="1750" font-family="Arial" font-size="30" fill="#172B3A">Đây là bước căn chỉnh bank từ với vùng ảnh.</text><rect x="1050" y="1430" width="900" height="335" rx="18" fill="#F7FCF9" stroke="#173D5B" stroke-width="3"/><text x="1074" y="1484" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Phân biệt hai lớp căn chỉnh</text><text x="1074" y="1528" font-family="Arial" font-size="30" fill="#172B3A">CSA: vùng ảnh ↔ ngữ nghĩa danh từ / động từ.</text><text x="1074" y="1565" font-family="Arial" font-size="30" fill="#172B3A">Adapter: prompt riêng ảnh ↔ ROI / cặp ROI.</text><text x="1074" y="1602" font-family="Arial" font-size="30" fill="#172B3A"></text><text x="1074" y="1639" font-family="Arial" font-size="30" fill="#172B3A">Không ghép được box → bỏ slot đó;</text><text x="1074" y="1676" font-family="Arial" font-size="30" fill="#172B3A">không tự gán prompt vào toàn ảnh.</text><text x="1074" y="1713" font-family="Arial" font-size="30" fill="#172B3A">Vo′ và Vr′ vẫn là hai memory riêng cho decoder.</text><text x="1074" y="1750" font-family="Arial" font-size="30" fill="#172B3A">Reranking dùng lại ảnh và nhãn detector để chấm.</text><rect x="60" y="1840" width="2880" height="445" rx="18" fill="#FFF9ED" stroke="#9A6A18" stroke-width="3" stroke-dasharray="12 8"/><text x="84" y="1900" font-family="Arial" font-size="40" fill="#785114" font-weight="bold">CHỈ KHI HUẤN LUYỆN — CÙNG ENCODER / ADAPTER / DECODER Ở TRÊN</text><rect x="90" y="1945" width="880" height="285" rx="18" fill="#FFFCF5" stroke="#173D5B" stroke-width="3"/><text x="114" y="1999" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Giai đoạn 1: XE / Cross-Entropy</text><text x="114" y="2041" font-family="Arial" font-size="28" fill="#172B3A">Caption TRAIN dịch phải → teacher forcing</text><text x="114" y="2076" font-family="Arial" font-size="28" fill="#172B3A">LCE = − mean log p(từ đúng | ảnh, tiền tố)</text><text x="114" y="2111" font-family="Arial" font-size="28" fill="#172B3A"></text><text x="114" y="2146" font-family="Arial" font-size="28" fill="#172B3A">Chạy 10 epoch từ khởi tạo mới của mạng học.</text><text x="114" y="2181" font-family="Arial" font-size="28" fill="#172B3A">CLIP và các nguồn tiền huấn luyện giữ cố định.</text><text x="114" y="2216" font-family="Arial" font-size="28" fill="#172B3A">Chọn checkpoint theo CIDEr trên VALID. </text><rect x="1060" y="1945" width="880" height="285" rx="18" fill="#FFFCF5" stroke="#173D5B" stroke-width="3"/><text x="1084" y="1999" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Giai đoạn 2: SCST + CE</text><text x="1084" y="2041" font-family="Arial" font-size="28" fill="#172B3A">Cùng ảnh → câu lấy mẫu ys và câu greedy yg</text><text x="1084" y="2076" font-family="Arial" font-size="28" fill="#172B3A">A = CIDEr(ys, refs TRAIN) − CIDEr(yg, refs TRAIN)</text><text x="1084" y="2111" font-family="Arial" font-size="28" fill="#172B3A">LSCST = − mean [A · tổng log p(ys)]</text><text x="1084" y="2146" font-family="Arial" font-size="28" fill="#172B3A">L = LCE + 0,05 LSCST</text><text x="1084" y="2181" font-family="Arial" font-size="28" fill="#172B3A">14.161 update / toàn bộ 113.287 ảnh TRAIN</text><text x="1084" y="2216" font-family="Arial" font-size="28" fill="#172B3A">Adam lr=0,000005; global batch=8.</text><rect x="2030" y="1945" width="880" height="285" rx="18" fill="#FFFCF5" stroke="#173D5B" stroke-width="3"/><text x="2054" y="1999" font-family="Arial" font-size="36" fill="#173D5B" font-weight="bold">Cách dùng khi suy luận / TEST</text><text x="2054" y="2041" font-family="Arial" font-size="28" fill="#172B3A">Không cần caption tham chiếu để sinh / chọn câu.</text><text x="2054" y="2076" font-family="Arial" font-size="28" fill="#172B3A">Không chạy CE hoặc SCST khi suy luận.</text><text x="2054" y="2111" font-family="Arial" font-size="28" fill="#172B3A">Không có thưởng đối tượng trong loss lượt này.</text><text x="2054" y="2146" font-family="Arial" font-size="28" fill="#172B3A">Thành phần đối tượng O nằm ở reranking.</text><text x="2054" y="2181" font-family="Arial" font-size="28" fill="#172B3A">CHAIR là bộ đo hậu kiểm, không phải bộ chọn.</text><text x="2054" y="2216" font-family="Arial" font-size="28" fill="#172B3A">Refs TEST chỉ dùng tính các chỉ số sau cùng.</text><text x="60" y="2358" font-family="Arial" font-size="28" fill="#536574">Ký hiệu: N = số ROI hợp lệ; Vo/Vr = memory đối tượng/quan hệ; dấu ′ = sau adapter. Các mạng học dùng d=512, 8 head.</text><text x="60" y="2403" font-family="Arial" font-size="28" fill="#536574">Sơ đồ theo mã đã chạy: model.py • prompt_adapter_model.py • prompt_scratch_model.py • prompt_scst_rerank.py (06/11/2026).</text><text x="60" y="2448" font-family="Arial" font-size="28" fill="#536574">Đây là pipeline triển khai hiện tại, không phải tuyên bố tái hiện nguyên bản CSA-Net hoặc bảo đảm quan hệ dự đoán đều đúng.</text></svg>