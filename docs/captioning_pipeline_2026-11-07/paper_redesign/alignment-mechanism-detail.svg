ht="400" font-style="normal" fill="#252b2e"><tspan x="955.0" dy="0">Masked cross-attn</tspan><tspan x="955.0" dy="24.86">Q: memory  K,V: Z</tspan></text><path d="M1052 735C1053 742 1060 743 1057 749C1053 753 1045 749 1048 744Z" fill="#e9a06c" stroke="#b87547" stroke-width=".8"/></g><g id="projection"><rect x="1130" y="750" width="180" height="60" rx="6" fill="#eaf4f6" stroke="#465158" stroke-width="1"/><text x="1220.0" y="788.5" text-anchor="middle" font-size="25" font-weight="400" font-style="normal" fill="#252b2e"><tspan x="1220.0" dy="0">Projection</tspan></text><path d="M1302 745C1303 752 1310 753 1307 759C1303 763 1295 759 1298 754Z" fill="#e9a06c" stroke="#b87547" stroke-width=".8"/></g><g id="sum"><circle cx="1430" cy="780" r="11" fill="white" stroke="#465158" stroke-width="1"/><text x="1430" y="787" text-anchor="middle" font-size="24" font-weight="400" font-style="normal" fill="#252b2e"><tspan x="1430" dy="0">+</tspan></text></g><g id="updated"><rect x="1520" y="745" width="195" height="70" rx="0" fill="#eaf4f6" stroke="#465158" stroke-width="1"/><text x="1617.5" y="774.6" text-anchor="middle" font-size="24" font-weight="400" font-style="normal" fill="#252b2e"><tspan x="1617.5" dy="0">Updated memory</tspan><tspan x="1617.5" dy="27.119999999999997">Vo′ or Vr′</tspan></text></g><text x="890" y="38" text-anchor="middle" font-size="30" font-weight="700" font-style="normal" fill="#252b2e"><tspan x="890" dy="0">Where visual–semantic alignment happens</tspan></text><text x="890.0" y="74" text-anchor="middle" font-size="22" font-weight="700" font-style="italic" fill="#252b2e"><tspan x="890.0" dy="0">A. Semantic bank–region alignment</tspan></text><text x="730" y="162" text-anchor="middle" font-size="23" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="730" dy="0">H</tspan></text><text x="1228" y="327" text-anchor="middle" font-size="20" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="1228" dy="0">K,V</tspan></text><text x="890" y="429" text-anchor="middle" font-size="24" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="890" dy="0">Object: (V, Pn) → (V₁, T₁) → (Vo, T₂); relation: (Vo, Pv) → Vr.</tspan></text><text x="890" y="456" text-anchor="middle" font-size="20" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="890" dy="0">Second object stage uses T₁. Standard residual / normalization / FFN steps are abbreviated.</tspan></text><text x="890.0" y="519" text-anchor="middle" font-size="22" font-weight="700" font-style="italic" fill="#252b2e"><tspan x="890.0" dy="0">B. Image-specific prompt–region alignment</tspan></text><text x="890" y="883" text-anchor="middle" font-size="23" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="890" dy="0">Attention is allowed only between each ROI and its linked prompt slots; unmatched ROIs stay unchanged.</tspan></text><text x="890" y="949" text-anchor="middle" font-size="23" font-weight="400" font-style="italic" fill="#252b2e"><tspan x="890" dy="0">A learns soft semantic correspondence; B restricts prompt attention using matched object / relation endpoints.</tspan></text></g></svg>