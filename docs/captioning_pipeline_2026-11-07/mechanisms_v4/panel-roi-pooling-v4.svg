<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2272 392" role="img" aria-labelledby="panel-roi-pooling-v4-title panel-roi-pooling-v4-desc" id="panel-roi-pooling-v4-root"><title id="panel-roi-pooling-v4-title">Box-weighted ROI pooling · visual detail</title><desc id="panel-roi-pooling-v4-desc">An image captioning architecture with explicit semantic, prompt, generation and selection mechanisms.</desc><defs>
      <style>#panel-roi-pooling-v4-root { color: #263238; font-family: Arial,"Liberation Sans",sans-serif; }
      #panel-roi-pooling-v4-root .diagram-container { width:100%;overflow-x:auto }
      #panel-roi-pooling-v4-root text { fill:#263238 }
      #panel-roi-pooling-v4-root figcaption { max-width:1000px;margin:20px auto;padding:16px;font-size:16px;line-height:1.6 }
      @media print {
#panel-roi-pooling-v4-root .diagram-container { overflow:visible }
      #panel-roi-pooling-v4-root figcaption { display:none }
}</style><marker id="panel-roi-pooling-v4-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#56616B"/></marker></defs><rect width="2272" height="392" fill="#fff"/><rect x="8" y="8" width="2256" height="376" rx="0" fill="#fff" stroke="#B4BFC6" stroke-width="1.4" stroke-dasharray="10 7"/><text x="32" y="48" font-size="28" font-weight="600" text-anchor="start">Visual detail   Box-weighted ROI pooling</text><path data-edge="r-patches-weights" d="M 288,128 L 320,128 L 320,176 L 368,176" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><path data-edge="r-boxes-weights" d="M 288,280 L 336,280 L 336,224 L 368,224" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><path data-edge="r-weights-mean" d="M 728,200 L 824,200" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><path data-edge="r-mean-descriptors" d="M 1264,200 L 1360,200" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><path data-edge="r-descriptors-projection" d="M 1608,200 L 1704,200" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><path data-edge="r-projection-V" d="M 1960,200 L 2056,200" fill="none" stroke="#56616B" stroke-width="1.7" marker-end="url(#panel-roi-pooling-v4-arrow)"/><g id="r-patches"><rect data-node-id="r-patches" x="32" y="96" width="256" height="64" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="160.0" y="120.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="r-patches">Patch features fⱼ</text><text x="160.0" y="149.98000000000002" font-size="22" font-weight="400" text-anchor="middle" data-owner="r-patches">14 × 14 × 768 · no CLS</text></g><g id="r-boxes"><rect data-node-id="r-boxes" x="32" y="248" width="256" height="64" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="160.0" y="273.14" font-size="21" font-weight="600" text-anchor="middle" data-owner="r-boxes">Bounding box Bᵢ</text><text x="160.0" y="301.14" font-size="21" font-weight="400" text-anchor="middle" data-owner="r-boxes">normalized to patch grid</text></g><g id="r-weights"><rect data-node-id="r-weights" x="368" y="144" width="360" height="112" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="548.0" y="192.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="r-weights">Patch–box intersection area</text><text x="548.0" y="221.98" font-size="22" font-weight="400" text-anchor="middle" data-owner="r-weights">wᵢⱼ = area(Bᵢ ∩ patchⱼ)</text></g><g id="r-mean"><rect data-node-id="r-mean" x="824" y="144" width="440" height="112" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1044.0" y="192.34" font-size="26" font-weight="600" text-anchor="middle" data-owner="r-mean">Weighted patch mean</text><text x="1044.0" y="225.34" font-size="26" font-weight="400" text-anchor="middle" data-owner="r-mean">rᵢ = Σⱼ wᵢⱼ fⱼ / Σⱼ wᵢⱼ</text></g><g id="r-descriptors"><rect data-node-id="r-descriptors" x="1360" y="144" width="248" height="112" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1484.0" y="192.66" font-size="24" font-weight="600" text-anchor="middle" data-owner="r-descriptors">Region descriptors</text><text x="1484.0" y="223.66" font-size="24" font-weight="400" text-anchor="middle" data-owner="r-descriptors">N × 768</text></g><g id="r-projection"><rect data-node-id="r-projection" x="1704" y="144" width="256" height="112" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1824.0" y="192.82" font-size="23" font-weight="600" text-anchor="middle" data-owner="r-projection">Linear projection</text><text x="1824.0" y="222.82" font-size="23" font-weight="400" text-anchor="middle" data-owner="r-projection">768 → 512</text></g><g data-icon-kind="trainable" data-module="r-projection" transform="translate(1937 151) scale(.8)" fill="#F6A23A" stroke="#D95F1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 0 C15 7 7 8 13 12 C15 10 16 8 16 6 C22 14 19 23 10 23 C1 23 -1 15 4 9 C4 13 6 14 7 13 C3 7 11 6 11 0 Z"/><path d="M10 14 C15 18 14 21 10 21 C6 21 6 18 10 14 Z"/></g><g id="r-V"><rect data-node-id="r-V" x="2056" y="144" width="176" height="112" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="2144.0" y="192.34" font-size="26" font-weight="600" text-anchor="middle" data-owner="r-V">V</text><text x="2144.0" y="225.34" font-size="26" font-weight="400" text-anchor="middle" data-owner="r-V">N × 512</text></g><text x="1136" y="344" font-size="24" font-weight="400" text-anchor="middle">One weighted descriptor per box; partial patch overlaps contribute proportionally. No crop image encoder.</text></svg>
