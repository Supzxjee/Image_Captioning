oun bank Eₙ</text><text x="648.0" y="291.46" font-size="19" font-weight="400" text-anchor="middle" data-owner="a-nouns">512-D embeddings</text></g><g id="a-verbs"><rect data-node-id="a-verbs" x="800" y="240" width="208" height="64" rx="0" fill="#E2F1F5" stroke="#8A969E" stroke-width="1.4"/><text x="904.0" y="265.46" font-size="19" font-weight="600" text-anchor="middle" data-owner="a-verbs">Fixed verb bank Eᵥ</text><text x="904.0" y="291.46" font-size="19" font-weight="400" text-anchor="middle" data-owner="a-verbs">512-D embeddings</text></g><g id="a-noun-agg"><rect data-node-id="a-noun-agg" x="544" y="352" width="208" height="80" rx="8" fill="#FCEBDD" stroke="#8A969E" stroke-width="1.4"/><text x="640.0" y="385.46" font-size="19" font-weight="600" text-anchor="middle" data-owner="a-noun-agg">Learned semantic</text><text x="640.0" y="411.46" font-size="19" font-weight="400" text-anchor="middle" data-owner="a-noun-agg">aggregation</text></g><g data-icon-kind="trainable" data-module="a-noun-agg" transform="translate(729 359) scale(.8)" fill="#F6A23A" stroke="#D95F1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 0 C15 7 7 8 13 12 C15 10 16 8 16 6 C22 14 19 23 10 23 C1 23 -1 15 4 9 C4 13 6 14 7 13 C3 7 11 6 11 0 Z"/><path d="M10 14 C15 18 14 21 10 21 C6 21 6 18 10 14 Z"/></g><g id="a-noun-p"><rect data-node-id="a-noun-p" x="544" y="480" width="208" height="64" rx="0" fill="#FCEBDD" stroke="#8A969E" stroke-width="1.4"/><text x="648.0" y="504.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="a-noun-p">Pₙ</text><text x="648.0" y="533.98" font-size="22" font-weight="400" text-anchor="middle" data-owner="a-noun-p">150 × 512</text></g><g id="a-verb-agg"><rect data-node-id="a-verb-agg" x="800" y="352" width="208" height="80" rx="8" fill="#E2F1F5" stroke="#8A969E" stroke-width="1.4"/><text x="896.0" y="385.46" font-size="19" font-weight="600" text-anchor="middle" data-owner="a-verb-agg">Learned semantic</text><text x="896.0" y="411.46" font-size="19" font-weight="400" text-anchor="middle" data-owner="a-verb-agg">aggregation</text></g><g data-icon-kind="trainable" data-module="a-verb-agg" transform="translate(985 359) scale(.8)" fill="#F6A23A" stroke="#D95F1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 0 C15 7 7 8 13 12 C15 10 16 8 16 6 C22 14 19 23 10 23 C1 23 -1 15 4 9 C4 13 6 14 7 13 C3 7 11 6 11 0 Z"/><path d="M10 14 C15 18 14 21 10 21 C6 21 6 18 10 14 Z"/></g><g id="a-verb-p"><rect data-node-id="a-verb-p" x="800" y="480" width="208" height="64" rx="0" fill="#E2F1F5" stroke="#8A969E" stroke-width="1.4"/><text x="904.0" y="504.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="a-verb-p">Pᵥ</text><text x="904.0" y="533.98" font-size="22" font-weight="400" text-anchor="middle" data-owner="a-verb-p">150 × 512</text></g><text x="48" y="256" font-size="22" font-weight="600" text-anchor="start">OFFLINE · BUILT ONCE</text><text x="48" y="300" font-size="22" font-weight="400" text-anchor="start">TRAIN references only</text><text x="48" y="340" font-size="20" font-weight="400" text-anchor="start">No VALID / TEST references</text><text x="48" y="404" font-size="20" font-weight="600" text-anchor="start">Shared banks ≠ image-specific prompts</text><text x="48" y="448" font-size="20" font-weight="400" text-anchor="start">150 soft prototypes per bank;</text><text x="48" y="480" font-size="20" font-weight="400" text-anchor="start">not 150 selected words.</text><g id="a-E"><rect data-node-id="a-E" x="48" y="744" width="104" height="64" rx="0" fill="#FCEBDD" stroke="#8A969E" stroke-width="1.4"/><text x="100.0" y="783.48" font-size="22" font-weight="600" text-anchor="middle" data-owner="a-E">E</text></g><circle cx="176" cy="776" r="4" fill="#56616B"/><g id="a-wa"><rect data-node-id="a-wa" x="224" y="696" width="128" height="64" rx="8" fill="#FCEBDD" stroke="#8A969E" stroke-width="1.4"/><text x="280.0" y="734.12" font-size="18" font-weight="600" text