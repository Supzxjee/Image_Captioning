-weight="400" text-anchor="middle" data-owner="cr-output">Zero-initialized</text></g><g data-icon-kind="trainable" data-module="cr-output" transform="translate(1201 759) scale(.8)" fill="#F6A23A" stroke="#D95F1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 0 C15 7 7 8 13 12 C15 10 16 8 16 6 C22 14 19 23 10 23 C1 23 -1 15 4 9 C4 13 6 14 7 13 C3 7 11 6 11 0 Z"/><path d="M10 14 C15 18 14 21 10 21 C6 21 6 18 10 14 Z"/></g><g><circle data-node-id="cr-sum" cx="1052" cy="904" r="20" fill="#fff" stroke="#56616B" stroke-width="1.7"/><text x="1052" y="913" font-size="28" font-weight="400" text-anchor="middle" data-owner="cr-sum">+</text></g><g id="cr-updated"><rect data-node-id="cr-updated" x="880" y="976" width="344" height="64" rx="0" fill="#E2F1F5" stroke="#8A969E" stroke-width="1.4"/><text x="1052.0" y="1016.84" font-size="26" font-weight="600" text-anchor="middle" data-owner="cr-updated">Vᵣ′ : N × 512</text></g><text x="624" y="1096" font-size="23" font-weight="600" text-anchor="middle">No valid linked slot → zero residual.  No adapter gate.</text></g></svg></div><figcaption>Kiến trúc chú thích ảnh: bank TRAIN toàn cục khác với prompt riêng ảnh. Hai Slot MLP nhận embedding chữ, đặc trưng vùng Vo gốc và tọa độ box chuẩn hóa bằng concatenation. Ba fusion dùng cùng cấu trúc với tham số riêng; hai memory sau adapter đi riêng vào decoder. D/C được min–max trên cùng năm ứng viên; S = 0.3D + 0.4C + 0.3O. Training XE rồi XE + 0.05 SCST dùng CIDEr; reranking không là loss. Icon biểu thị trạng thái tham số khi huấn luyện. Ảnh chỉ minh họa, không phải kết quả chạy mới. Các cổng tensor cùng tên là cùng dữ liệu. Dùng các panel vector riêng khi dàn trang để giữ chữ đọc được.</figcaption></main></body></html>
