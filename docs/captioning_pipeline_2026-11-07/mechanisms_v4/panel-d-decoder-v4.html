t-anchor="middle" data-owner="d-candidates">y₁ … y₅</text></g><text x="400" y="1320" font-size="20" font-weight="400" text-anchor="middle">Generated token → next prefix</text></svg></div><figcaption>Kiến trúc chú thích ảnh: bank TRAIN toàn cục khác với prompt riêng ảnh. Hai Slot MLP nhận embedding chữ, đặc trưng vùng Vo gốc và tọa độ box chuẩn hóa bằng concatenation. Ba fusion dùng cùng cấu trúc với tham số riêng; hai memory sau adapter đi riêng vào decoder. D/C được min–max trên cùng năm ứng viên; S = 0.3D + 0.4C + 0.3O. Training XE rồi XE + 0.05 SCST dùng CIDEr; reranking không là loss. Icon biểu thị trạng thái tham số khi huấn luyện. Ảnh chỉ minh họa, không phải kết quả chạy mới. Các cổng tensor cùng tên là cùng dữ liệu. Dùng các panel vector riêng khi dàn trang để giữ chữ đọc được.</figcaption></main></body></html>
