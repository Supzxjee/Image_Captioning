94 6.5 L4.7 10 M3.94 6.5 L7.5 6 M16.06 13.5 L12.5 14 M16.06 13.5 L15.3 10"/><path d="M3.94 13.5 L7.5 14 M3.94 13.5 L4.7 10 M16.06 6.5 L15.3 10 M16.06 6.5 L12.5 6"/></g><g id="e-cosine"><rect data-node-id="e-cosine" x="464" y="432" width="352" height="80" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="640.0" y="464.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="e-cosine">Cosine-based CLIPScore</text><text x="640.0" y="493.98" font-size="22" font-weight="400" text-anchor="middle" data-owner="e-cosine">2.5 max(cosine, 0)</text></g><g id="e-C-minmax"><rect data-node-id="e-C-minmax" x="464" y="584" width="352" height="80" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="640.0" y="617.14" font-size="21" font-weight="600" text-anchor="middle" data-owner="e-C-minmax">Min–max normalization</text><text x="640.0" y="645.14" font-size="21" font-weight="400" text-anchor="middle" data-owner="e-C-minmax">over the same 5 candidates</text></g><g id="e-mentions"><rect data-node-id="e-mentions" x="888" y="280" width="352" height="80" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1064.0" y="313.14" font-size="21" font-weight="600" text-anchor="middle" data-owner="e-mentions">Mentioned object extraction</text><text x="1064.0" y="341.14" font-size="21" font-weight="400" text-anchor="middle" data-owner="e-mentions">from candidate caption</text></g><g id="e-supported"><rect data-node-id="e-supported" x="888" y="432" width="352" height="80" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1064.0" y="464.98" font-size="22" font-weight="600" text-anchor="middle" data-owner="e-supported">Supported object labels</text><text x="1064.0" y="493.98" font-size="22" font-weight="400" text-anchor="middle" data-owner="e-supported">from YOLO detections</text></g><g id="e-consistency"><rect data-node-id="e-consistency" x="888" y="584" width="352" height="88" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1064.0" y="620.66" font-size="24" font-weight="600" text-anchor="middle" data-owner="e-consistency">Detector-based</text><text x="1064.0" y="651.66" font-size="24" font-weight="400" text-anchor="middle" data-owner="e-consistency">object consistency</text></g><g id="e-O-normalize"><rect data-node-id="e-O-normalize" x="888" y="736" width="352" height="72" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1064.0" y="765.14" font-size="21" font-weight="600" text-anchor="middle" data-owner="e-O-normalize">Normalized object score</text><text x="1064.0" y="793.14" font-size="21" font-weight="400" text-anchor="middle" data-owner="e-O-normalize">(consistency + 1) / 2</text></g><g id="e-D"><rect data-node-id="e-D" x="40" y="888" width="352" height="64" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="216.0" y="929.52" font-size="28" font-weight="600" text-anchor="middle" data-owner="e-D">D</text></g><g id="e-C"><rect data-node-id="e-C" x="464" y="888" width="352" height="64" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="640.0" y="929.52" font-size="28" font-weight="600" text-anchor="middle" data-owner="e-C">C</text></g><g id="e-O"><rect data-node-id="e-O" x="888" y="888" width="352" height="64" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="1064.0" y="929.52" font-size="28" font-weight="600" text-anchor="middle" data-owner="e-O">O</text></g><text x="248" y="680" font-size="20" font-weight="400" text-anchor="start">No length</text><text x="248" y="712" font-size="20" font-weight="400" text-anchor="start">normalization.</text><g id="e-weighted"><rect data-node-id="e-weighted" x="40" y="1008" width="1200" height="80" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="640.0" y="1058.2" font-size="30" font-weight="600" text-anchor="middle" data-owner="e-weighted">S(y) = 0.3 D(y) + 0.4 C(y) + 0.3 O(y)</text></g><g id="e-select"><rect data-node-id="e-select" x="40" y="1144" width="520" height="72" rx="8" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="300.0" y="1188.5" font-size="25" font-weight="600" text-anchor="middle" data-owner="e-select">Select highest-scoring candidate</text></g><g id="e-final"><rect data-node-id="e-final" x="720" y="1144" width="520" height="72" rx="0" fill="#EDF3F8" stroke="#8A969E" stroke-width="1.4"/><text x="980.0" y="1190.2" font-size="30" font-weight="600" text-anchor="middle" data-owner="e-final">Final caption</text></g><text x="640" y="1264" font-size="23" font-weight="600" text-anchor="middle">Equal scores: earlier beam wins.</text><text x="640" y="1304" font-size="22" font-weight="400" text-anchor="middle">References and CHAIR are not used for selection.</text></svg></div><figcaption>Kiến trúc chú thích ảnh: bank TRAIN toàn cục khác với prompt riêng ảnh. Hai Slot MLP nhận embedding chữ, đặc trưng vùng Vo gốc và tọa độ box chuẩn hóa bằng concatenation. Ba fusion dùng cùng cấu trúc với tham số riêng; hai memory sau adapter đi riêng vào decoder. D/C được min–max trên cùng năm ứng viên; S = 0.3D + 0.4C + 0.3O. Training XE rồi XE + 0.05 SCST dùng CIDEr; reranking không là loss. Icon biểu thị trạng thái tham số khi huấn luyện. Ảnh chỉ minh họa, không phải kết quả chạy mới. Các cổng tensor cùng tên là cùng dữ liệu. Dùng các panel vector riêng khi dàn trang để giữ chữ đọc được.</figcaption></main></body></html>
